# Production-Ready Multi-Architecture Microservices Manifest (ARM64 & AMD64 Compatible)
# Services: frontend, cartservice, paymentservice, productcatalogservice, emailservice, redis-cart
apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
    app.kubernetes.io/name: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
        app.kubernetes.io/name: cart-service
    spec:
      containers:
      - name: server
        image: python:3.12-alpine
        command: ["python3", "-c"]
        args:
        - |
          import http.server, socketserver, json
          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"service":"cart-service","status":"HEALTHY","items":[]}\n')
              def log_message(self, *a): pass
          socketserver.TCPServer(("", 7070), H).serve_forever()
        ports:
        - containerPort: 7070
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 250m
            memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
---
