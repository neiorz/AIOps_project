# Production-Ready Multi-Architecture Microservices Manifest (ARM64 & AMD64 Compatible)
# Services: frontend, cartservice, paymentservice, productcatalogservice, redis-cart
apiVersion: v1
kind: Namespace
metadata:
  name: default
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cartservice
  labels:
    app: cartservice
    app.kubernetes.io/name: cart-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cartservice
  template:
    metadata:
      labels:
        app: cartservice
        app.kubernetes.io/name: cart-service
    spec:
      containers:
      - name: server
        image: python:3.12-alpine
        command: ["python3", "-c"]
        args:
        - |
          import http.server, socketserver, json, time, os, sys, threading

          def stress_worker():
              while True:
                  if os.path.exists('/tmp/cpu_stress'):
                      _ = [x * x for x in range(35000)]
                  else:
                      time.sleep(0.5)

          for _ in range(4):
              threading.Thread(target=stress_worker, daemon=True).start()

          class H(http.server.BaseHTTPRequestHandler):
              def do_GET(self):
                  if os.path.exists('/tmp/latency_ms'):
                      try:
                          with open('/tmp/latency_ms') as f:
                              ms = float(f.read().strip())
                          time.sleep(ms / 1000.0)
                          sys.stderr.write(f"[{time.strftime('%X')}] [WARN] NetworkChaos Latency: delayed cart-service response by {ms}ms\n")
                          sys.stderr.flush()
                      except Exception:
                          pass
                  self.send_response(200)
                  self.send_header("Content-Type", "application/json")
                  self.end_headers()
                  self.wfile.write(b'{"service":"cart-service","status":"HEALTHY","items":[]}\n')
                  sys.stderr.write(f"[{time.strftime('%X')}] HTTP GET {self.path} 200 OK\n")
                  sys.stderr.flush()
              def log_message(self, *a): pass

          socketserver.TCPServer(("", 7070), H).serve_forever()
        ports:
        - containerPort: 7070
        resources:
          requests:
            cpu: 50m
            memory: 32Mi
          limits:
            cpu: 1000m
            memory: 256Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cartservice
  labels:
    app: cartservice
spec:
  type: ClusterIP
  selector:
    app: cartservice
  ports:
  - name: grpc
    port: 7070
    targetPort: 7070
